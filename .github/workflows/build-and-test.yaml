name: Build & Test

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      record-all-tests:
        description: Upload the screen recording of every UI test, not only failed ones
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET environment
        uses: ./.github/actions/setup-dotnet-env

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Platform=x64 -p:AppxPackageSigningEnabled=false

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            src/*/bin/x64/Release
            tests/*/bin/x64/Release
          if-no-files-found: error
          retention-days: 1

  unit-test:
    name: Run unit tests
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET environment
        uses: ./.github/actions/setup-dotnet-env

      - name: Install dependencies
        run: dotnet restore

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Unit test
        run: dotnet test --no-build --configuration Release -p:Platform=x64 --filter "FullyQualifiedName~.UnitTests." --logger GitHubActions

  ui-test:
    name: Run UI tests
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SURVEIL_EXE: ${{ github.workspace }}\src\Surveil\bin\x64\Release\net10.0-windows10.0.19041.0\win-x64\Surveil.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET environment
        uses: ./.github/actions/setup-dotnet-env

      - name: Install dependencies
        run: dotnet restore

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build-output

      - name: Ensure ffmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
          }
          $ffmpeg = (Get-Command ffmpeg).Source
          Write-Host "ffmpeg: $ffmpeg"
          "WINUIA_FFMPEG=$ffmpeg" >> $env:GITHUB_ENV

      - name: UI test
        run: >-
          dotnet test --no-build --configuration Release -p:Platform=x64 --filter "FullyQualifiedName~.UiTests."
          --logger GitHubActions --logger trx --results-directory TestResults

      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: TestResults

      - name: Collect recordings
        if: always()
        shell: pwsh
        env:
          KIND: ${{ inputs.record-all-tests && 'All' || 'Failed' }}
        run: |
          New-Item -ItemType Directory -Force recordings | Out-Null
          Get-ChildItem tests -Recurse -Directory -Filter $env:KIND -ErrorAction SilentlyContinue |
            Where-Object { $_.Parent.Name -eq 'Recordings' } |
            ForEach-Object { Copy-Item (Join-Path $_.FullName '*') recordings -Force }

      - name: Upload recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-recordings
          path: recordings
          if-no-files-found: ignore
          retention-days: 14
